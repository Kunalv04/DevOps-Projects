name: CI-CD Pipeline

on:
  workflow_dispatch:

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Backend Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/backend ./DevOps-Project-03/backend

    - name: Build React Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/react ./DevOps-Project-03/frontend

    - name: Build LAMP Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/lamp ./DevOps-Project-03/lamp

    - name: Push Backend Image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/backend

    - name: Push React Image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/react

    - name: Push LAMP Image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/lamp

  Test:
    needs: Build
    runs-on: ubuntu-latest
    steps:

    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Run Tests
      run: |
        cd DevOps-Project-03/backend
        npm install
        npm test

    - name: Run Frontend Tests
      run: |
        cd DevOps-Project-03/frontend
        npm install
        npm test

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@v2
      with:
        args: >
          -Dsonar.projectKey=iot-project
          -Dsonar.organization=kgdevops
          -Dsonar.host.url=https://sonarcloud.io
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  Deploy:
    needs: Test
    runs-on: ubuntu-latest
    steps:

    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Trigger AWS Deployment
      run: |
        curl -X POST https://jpfr8ct83i.execute-api.us-east-1.amazonaws.com/deploy \
        -H "Content-Type: application/json" \
        -d '{
          "repo": "${{ github.repository }}",
          "commit": "${{ github.sha }}"
        }'
